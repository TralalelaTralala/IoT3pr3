<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IoT Weather Station</title>
<style>body{font:16px Segoe UI,Arial;background:#101820;color:#ecf2f7;margin:0;padding:22px}h1{font-size:23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#1d2934;border:1px solid #344452;border-radius:10px;padding:14px}.v{font-size:27px;font-weight:700;color:#72d4c2}.muted{color:#aab7c3}button,input{padding:9px;background:#101820;color:#fff;border:1px solid #566775;border-radius:6px}button{background:#176e62;cursor:pointer}</style>
<h1>Мультипротокольна метеостанція</h1><p id="status" class="muted">Завантаження…</p><div id="grid" class="grid"></div><section class="card" style="margin-top:16px"><h2>Налаштування</h2><label>Інтервал, с <input id="interval" type="number" min="1" max="60" value="2"></label> <label>Місце <input id="location" value="Навчальна лабораторія"></label> <button onclick="saveConfig()">Зберегти</button><pre id="result"></pre><p class="muted">API: <a href="/api/docs">/api/docs</a> • BLE GATT profile: Weather Service 181A</p></section>
<script>const labels={temperature:['Температура','°C'],humidity:['Вологість','%'],pressure:['Тиск','hPa'],light:['Освітленість','lx'],air_quality:['Якість повітря','AQI'],wind_speed:['Швидкість вітру','m/s']};async function load(){try{const s=await(await fetch('/api/sensors')).json(),st=await(await fetch('/api/status')).json();document.getElementById('status').textContent=`${s.location} • MQTT ${st.mqtt_connected?'ONLINE':'RETRYING'} • ${new Date().toLocaleTimeString('uk-UA')}`;document.getElementById('grid').innerHTML=Object.entries(s.sensors).map(([k,v])=>`<article class="card"><div class="muted">${labels[k][0]}</div><div class="v">${Number(v.value).toLocaleString('uk-UA',{maximumFractionDigits:2})} ${labels[k][1]}</div><small>${v.health?'OK':'FAULT'}</small></article>`).join('');document.getElementById('interval').value=(await(await fetch('/api/config')).json()).interval_seconds;document.getElementById('location').value=s.location}catch(e){console.error(e)}}async function saveConfig(){const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interval_seconds:Number(document.getElementById('interval').value),location:document.getElementById('location').value})});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2);load()}load();setInterval(load,3000);</script></html>
